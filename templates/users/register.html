{% extends 'base.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card card-lilac p-5">
            <h3 class="text-lilac text-center mb-4 fw-bold">Приєднуйся до нас!</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-lilac py-2 fs-5">Зареєструватися</button>
                </div>
            </form>
            <p class="text-center mt-3 text-muted">
                Вже є акаунт? <a href="{% url 'login' %}" style="color: #8c52ff;">Увійти</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
