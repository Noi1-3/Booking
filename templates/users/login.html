{% extends 'base.html' %}

{% block title %}Вхід в систему{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-lilac p-5">
            <h3 class="text-lilac text-center mb-4 fw-bold">З поверненням</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-lilac py-2 fs-5">Увійти</button>
                </div>
            </form>
            <p class="text-center mt-3 text-muted">
                Ще немає акаунту? <a href="{% url 'register' %}" style="color: #8c52ff;">Зареєструватися</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
